<!doctype html><html><head><meta name="robots" content="noindex,noarchive"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Laia Support App · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Playfair+Display:ital,wght@0,600;1,500&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --pink:#FF1F8E;--orange:#FF6B00;--lime:#C8D400;--teal:#00B5B8;
  --ink:#0D0D0D;--ink2:#3A3A3F;--muted:#6E6E76;--line:#DDDDDD;--line2:#ECEAE4;
  --paper:#F7F5F0;--surface:#FFFFFF;--surface2:#FBFAF7;--field:#FFFDF2;--fieldline:#E4DFC8;
  --pinkSoft:#FFE6F2;--tealSoft:#E0F6F6;--limeSoft:#F5F8D6;--orangeSoft:#FFEEDD;
  --warn:#B45309;--warnSoft:#FEF3C7;--ok:#0F766E;--bad:#B91C1C;
  --wsHead:#333333;--wsSum:#DDEEFF;--wsAlt:#F5F5F5;--wsSec:#EEEEEE;--wsHi:#FFF3B0;
  --shadow:0 1px 2px rgba(13,13,13,.06),0 6px 24px rgba(13,13,13,.06);
  --body:'Lato',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:'Courier Prime','Courier New',Courier,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#F3F1EC;--ink2:#D2D0CA;--muted:#9C9AA3;--line:#34343A;--line2:#2A2A30;
  --paper:#111114;--surface:#1A1A1F;--surface2:#16161A;--field:#23231F;--fieldline:#3E3C30;
  --pink:#FF4FA6;--teal:#2CCFD2;--orange:#FF8A33;--lime:#D4DF3A;
  --pinkSoft:#3A1428;--tealSoft:#0F2E2F;--limeSoft:#2A2D10;--orangeSoft:#35200E;
  --warn:#FBBF24;--warnSoft:#3A2E0B;--ok:#34D399;--bad:#F87171;
  --wsHead:#2B2B30;--wsSum:#1D2B3A;--wsAlt:#1E1E23;--wsSec:#26262C;--wsHi:#3A3312;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F3F1EC;--ink2:#D2D0CA;--muted:#9C9AA3;--line:#34343A;--line2:#2A2A30;
  --paper:#111114;--surface:#1A1A1F;--surface2:#16161A;--field:#23231F;--fieldline:#3E3C30;
  --pink:#FF4FA6;--teal:#2CCFD2;--orange:#FF8A33;--lime:#D4DF3A;
  --pinkSoft:#3A1428;--tealSoft:#0F2E2F;--limeSoft:#2A2D10;--orangeSoft:#35200E;
  --warn:#FBBF24;--warnSoft:#3A2E0B;--ok:#34D399;--bad:#F87171;
  --wsHead:#2B2B30;--wsSum:#1D2B3A;--wsAlt:#1E1E23;--wsSec:#26262C;--wsHi:#3A3312;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.money{font-variant-numeric:tabular-nums}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:5px}
.stripe i:nth-child(1){background:var(--pink)}.stripe i:nth-child(2){background:var(--orange)}.stripe i:nth-child(3){background:var(--lime)}.stripe i:nth-child(4){background:var(--teal)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 20px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;min-width:0}
.brand b{font-weight:900;font-size:17px;letter-spacing:.01em}
.brand span{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--muted)}
.result{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 12px;border-radius:8px;background:var(--pinkSoft);border:1px solid color-mix(in srgb,var(--pink) 30%,transparent)}
.result .amt{font-weight:900;font-size:20px;color:var(--pink)}
.result .who{font-weight:700}
.result .mode{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#062626}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.casebar{display:flex;gap:14px;flex-wrap:wrap;padding:6px 20px 8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line2)}
.casebar b{color:var(--ink)}
.savebar{padding:6px 20px;font-size:12.5px;background:var(--orangeSoft);color:var(--ink);border-top:1px solid color-mix(in srgb,var(--orange) 35%,transparent)}
.casebar .dirty{color:var(--orange);font-weight:700}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:0;min-height:calc(100vh - 120px)}
nav.nav{border-right:1px solid var(--line);background:var(--surface2);padding:14px 10px;position:sticky;top:112px;align-self:start;max-height:calc(100vh - 112px);overflow:auto}
.nav h4{font-family:var(--body);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px;font-weight:900}
.nav h4:first-child{margin-top:0}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;font-weight:700;font-size:13.5px}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--ink);color:var(--paper)}
.nav a .ct{font-size:11px;font-weight:700;opacity:.7}
main{padding:22px 26px 60px;min-width:0}
aside.rail{border-left:1px solid var(--line);padding:18px 16px;background:var(--surface2);position:sticky;top:112px;align-self:start;max-height:calc(100vh - 112px);overflow:auto}
h1.sec{font-size:24px;font-weight:900;margin:0 0 4px;text-wrap:balance}
.lede{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 18px;font-size:14.5px;max-width:70ch}
h3.sub{font-family:var(--serif);font-weight:600;font-size:17px;margin:22px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--field);border:1px solid var(--fieldline);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical;line-height:1.45}
input.m{text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--pink)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.chk input{margin-top:2px;flex:0 0 auto}
/* two-party entry table */
.pt{width:100%;border-collapse:collapse}
.pt th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink);font-weight:900}
.pt th:first-child{text-align:left}
.pt td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.pt td:first-child{color:var(--ink2);width:46%}
.pt td.v{width:27%}
.pt td .h{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.pt tr.calc td{background:var(--surface2);font-weight:700}
.pt tr.calc td.v{text-align:right;font-variant-numeric:tabular-nums;padding-right:18px}
.pt tr.tot td{background:var(--tealSoft);font-weight:900;border-bottom:2px solid var(--teal)}
.pt tr.tot td.v{text-align:right;padding-right:18px}
.pt tr.secrow td{padding-top:16px;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink);border-bottom:1px solid var(--line)}
.fa{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.06em;padding:1px 5px;border-radius:4px;background:var(--limeSoft);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rowlist{display:flex;flex-direction:column;gap:6px}
.rowline{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) auto;gap:6px;align-items:center}
.rowline.o{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto}
.x{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--pinkSoft)}
.kid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.65fr) minmax(0,.65fr) auto;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.pill{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.shared{background:var(--tealSoft);color:var(--teal)}.pill.sole{background:var(--orangeSoft);color:var(--orange)}
.flag{display:flex;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:8px;border-left:4px solid var(--teal);background:var(--tealSoft)}
.flag.warn{border-left-color:var(--orange);background:var(--orangeSoft)}
.flag b{flex:0 0 auto}
/* rail */
.rail h5{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:900}
.rail .big{font-size:30px;font-weight:900;color:var(--pink);line-height:1}
.rail .cap{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13px;margin:4px 0 14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px;margin-bottom:14px}
.kv span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv .hd{grid-column:1/-1;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:4px 0 10px;background:var(--line)}
.bar2 i{display:block}.bar2 i.a{background:var(--pink)}.bar2 i.b{background:var(--teal)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
/* worksheet */
.ws{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:980px}
.ws .wh{display:flex;justify-content:space-between;gap:20px;margin-bottom:10px}
.ws .wh b{font-size:13.5px}
.ws .banner{font-weight:700;color:var(--bad);font-size:11px;letter-spacing:.04em}
.ws .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ws table{width:100%;border-collapse:collapse}
.ws th{background:var(--wsHead);color:#fff;font-weight:700;text-align:right;padding:4px 6px;font-size:11px}
.ws th:first-child{text-align:left}
.ws td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line2)}
.ws td:first-child{text-align:left}
.ws tr:nth-child(even) td{background:var(--wsAlt)}
.ws tr.s td{background:var(--wsSec)!important;font-weight:700;border-top:1px solid var(--muted)}
.ws tr.t td{background:var(--wsSum)!important;font-weight:700}
.ws tr.hi td{background:var(--wsHi)!important;font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.ws tr.i td:first-child{padding-left:22px}
.ws .foot{margin-top:12px;font-size:11px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
/* scenario table */
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th{text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp tr.cur td{background:var(--pinkSoft);font-weight:700}
table.cmp input{max-width:110px}
table.cmp td.nm input{max-width:none;min-width:130px;text-align:left}
.chart svg{width:100%;height:auto;display:block}
.memo-prev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 30px;max-width:820px}
.memo-prev h2{font-size:14px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--pink);border-bottom:2px solid var(--pink);padding-bottom:3px;margin:22px 0 10px}
.memo-prev h2.o{color:var(--orange);border-color:var(--orange)}
.memo-prev p{max-width:72ch;margin:0 0 8px}
.memo-prev table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 12px}
.memo-prev td,.memo-prev th{border:1px solid var(--line);padding:5px 8px;text-align:left}
.memo-prev td.n{text-align:right}
.memo-prev th{background:var(--surface2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.callout{border-left:5px solid var(--pink);background:var(--pinkSoft);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0 12px}
.saved-list{display:flex;flex-direction:column;gap:8px}
.saved{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.saved .t{font-weight:900}
.saved .m{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(13,13,13,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:460px;width:100%;padding:20px 22px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:900}
.modal p{margin:0 0 14px;color:var(--ink2)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:40}
.menu .pop button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:700}
.menu .pop button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.menu .pop button:hover{background:var(--line2)}
.note{font-size:12.5px;color:var(--muted)}
.mobnav{display:none}
@media (max-width:1180px){.layout{grid-template-columns:200px minmax(0,1fr)}aside.rail{display:none}}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.nav{display:none}
  .mobnav{display:block;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
  main{padding:18px 16px 60px}
  .topbar,.casebar{padding-left:16px;padding-right:16px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pt td:first-child{width:40%}
  .memo-prev{padding:18px 16px}
}

/* access gate */
.gate{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate[hidden]{display:none}
.betacta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border-radius:10px;background:var(--pinkSoft);border:2px solid var(--pink);color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.betacta:hover{background:color-mix(in srgb,var(--pink) 18%,var(--surface))}
.betacta .go{background:var(--pink);color:#fff;font-weight:900;padding:9px 14px;border-radius:8px;white-space:nowrap}
.betacta:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-width:460px;width:100%;overflow:hidden}
.gate .card .body{padding:22px 24px 20px}
.gate h2{margin:0 0 4px;font-size:21px;font-weight:900}
.gate p{margin:0 0 14px;color:var(--ink2);font-size:13.5px}
.gate .row2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px}
.gate .err{color:var(--bad);font-size:12.5px;font-weight:700;min-height:18px;margin:6px 0 0}
.gate .fine{font-size:11.5px;color:var(--muted);margin:12px 0 0}

/* ===== v3 suite additions ===== */
.brand{flex-direction:row;align-items:center;gap:12px}
.brand img{height:42px;width:auto;border-radius:6px;background:#fff;padding:2px;flex:0 0 auto}
.brand .bt{display:flex;flex-direction:column;min-width:0}
nav.tabs{display:flex;gap:4px;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line2);scrollbar-width:thin}
.tab{border:none;background:transparent;padding:10px 14px 9px;font-weight:900;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.01em}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--pink)}
.tab:nth-child(2).on{border-bottom-color:var(--orange)}.tab:nth-child(3).on{border-bottom-color:var(--lime)}.tab:nth-child(4).on{border-bottom-color:var(--teal)}.tab:nth-child(5).on{border-bottom-color:var(--pink)}.tab:nth-child(6).on{border-bottom-color:var(--orange)}
.tab:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
nav.nav,aside.rail{top:var(--hdr,150px)!important;max-height:calc(100vh - var(--hdr,150px))!important}
.savebar.ok{background:var(--tealSoft);border-top-color:color-mix(in srgb,var(--teal) 35%,transparent)}
/* ED inventory */
table.edin{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1180px}
table.edin th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 5px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.edin td{padding:5px;border-bottom:1px solid var(--line2);vertical-align:top}
table.edin td.nmc{min-width:190px}
table.edin td .l4{margin-top:4px;max-width:90px}
table.edin input.m{min-width:84px}
table.edin select{min-width:110px;font-size:12.5px;padding:6px}
table.edin tr.debt td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
table.edin td.calc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
table.edin td.calc small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}

  return amts.map(a=>{const st=clone(S);st.alimony=Object.assign({},st.alimony,{amount:String(a),period:'monthly',payer:a>0?x.o:'',taxable:false});
    const r=calculate(effState(st));const csToReq=r.payer===x.o?r.final:r.payer===x.k?-r.final:0;
    const reqAfter=r[x.k].net+csToReq,payAfter=r[x.o].net-csToReq;

function linkedAlimony(){const a=S.aa||{};if(!a.enabled||!a.linkCS)return null;const x=alimonyAssess();let amt=0,label='';
  const u=a.useAmt||'cap';
  if(u==='custom'){amt=num(a.customAmt);label='custom amount';}
  else if(!x.threshold){amt=0;label='need and ability threshold not met';}

  else if(u==='need'){amt=x.need;label='full unmet need (bridge-the-gap / rehabilitative)';}
  return {amt:Math.max(0,Math.round(amt)),payer:x.o,label,x};}

function outVal(key){if(!R)return '';{const sv=outValSuite(key);if(sv!==null)return sv;}const [a,b,c]=key.split('.');
  if(a==='A'||a==='B'){const P=R[a];switch(b){case 'gross':return fm(P.gross);case 'net':return fm(P.net);case 'ss':return fm(P.ded.ss);case 'med':return fm(P.ded.med);case 'se':return fm(P.ded.se);case 'fed':return fm(P.ded.fed);case 'fedc':return fm(P.fedComputed);case 'totded':return fm(P.totalDed);case 'health':return fm(P.ded.health);case 'childins':return fm(P.childHealth);case 'wages':return fm(P.lines.ssTaxable);case 'ti':return fm(P.tax.ti/12);case 'credits':return `${P.tax.ctcKids} CTC / ${P.tax.odcKids} ODC / ${P.tax.eitcKids} EITC`;case 'eitc':return fm(P.tax.eitc)+'/yr';case 'pct':return pc(a==='A'?R.pctA:R.pctB);case 'ov':return fn(a==='A'?R.ovA:R.ovB,1);case 'op':return pc(a==='A'?R.opA:R.opB);}}
  if(a==='scen'){const sc=S.scenarios.find(x=>x.id===b);if(!sc)return '';const r=calcFor(sc);if(c==='amt')return fm(r.final);if(c==='who')return r.payer?pn(r.payer)+' → '+pn(r.payee):'No transfer';if(c==='mode')return modeL(r);if(c==='ov')return fn(r.ovA,1)+' / '+fn(r.ovB,1);if(c==='net')return fm(r.A.net)+' / '+fm(r.B.net);if(c==='basic')return fm(r.basic);}
  if(a==='R'){if(b==='combined')return fm(R.combined);if(b==='basic')return fm(R.basic);if(b==='care')return fm(R.paid.care.A+R.paid.care.B);}
  if(a==='camp'){return fm(num(S.costs.campAnnual)/12);}
  if(a==='mod'){const t=modTest(R);return t?modLine(t):'Enter the existing order to test';}
  if(a==='aa'){const x=alimonyAssess();return x[b]!==undefined?(typeof x[b]==='number'?fm(x[b]):String(x[b])):'';}
  return '';}

 secs.push({h:'Additions — child care, health insurance, medical',table:{head:['Cost paid','By '+pn('A',ex),'By '+pn('B',ex)],rows:[['Work-related child care',fm(r.paid.care.A),fm(r.paid.care.B)],["Children's health insurance",fm(r.paid.ins.A),fm(r.paid.ins.B)],['Uncovered medical / dental',fm(r.paid.med.A),fm(r.paid.med.B)],['Total paid',fm(r.paidA),fm(r.paidB)],['Share owed by income %',fm(r.costShareA),fm(r.costShareB)],['Adjustment (+ owes / − credit)',fm(r.costAdjA),fm(r.costAdjB)]]},paras:[S.costs.careNote?('Child care basis: '+S.costs.careNote):'Child care basis not documented — confirm FA Lines 40/43 and Line 58 treatment.',`Noncovered medical, dental, orthodontic, and prescription expenses going forward, by income share: ${pn('A',ex)} ${(r.pctA*100).toFixed(0)}% / ${pn('B',ex)} ${(r.pctB*100).toFixed(0)}%.`]});

 {const cc=claimsCompare();const cur=cc[0];secs.push({h:'Tax dependency & credits',paras:[`As entered: ${pn('A',ex)} claims ${S.children.filter(c=>c.taxDep==='A').length}, ${pn('B',ex)} claims ${S.children.filter(c=>c.taxDep==='B').length} ${S.children.length===1?'child':'children'}. Estimated EITC: ${pn('A',ex)} ${fm(r.A.tax.eitc)}/yr, ${pn('B',ex)} ${fm(r.B.tax.eitc)}/yr.`],table:{head:['Allocation','Child support','After support '+pn('A',ex),'After support '+pn('B',ex),'Combined'],rows:cc.map(x=>[x.label.replace(pn('A'),pn('A',ex)).replace(pn('B'),pn('B',ex)),fm(x.r.final)+(x.r.payer?' · '+pn(x.r.payer,ex):''),fm(x.afterA),fm(x.afterB),fm(x.afterA+x.afterB)])}});}

 const missing=kids.filter(k=>k.c.qualifies!==false&&!k.e).map(k=>kidName(k.c,k.i,ex));

 const ev=kids.filter(k=>k.e&&k.e.date>start).sort((a,b)=>a.e.date<b.e.date?-1:a.e.date>b.e.date?1:0);
 const st=clone(base);past.forEach(k=>{st.children[k.i].qualifies=false;});
 const rows=[{from:start,event:'Assessment date',r:calculate(effState(st))}];
 ev.forEach(k=>{st.children[k.i].qualifies=false;const r=calculate(effState(st));const last=rows[rows.length-1];

function parseFAText(text){const t=text;const iS=t.search(/SECTION\s+III\b|ASSETS\s+AND\s+LIABILITIES/i);if(iS<0)return {rows:[],note:'Section III (Assets and Liabilities) was not found in the text.'};

 block.forEach(raw=>{const line=raw.trim();const pm=line.match(/^--- page (\d+) ---$/);if(pm){page=pm[1];return;}if(!line)return;
  if(/\bB\.\s*LIABILITIES|^LIABILITIES\b|LIABILITIES\s*:|LIABILITIES\/DEBTS/i.test(line)){mode='debt';}
  if(/CONTINGENT\s+ASSETS/i.test(line))mode='casset';if(/CONTINGENT\s+LIABILITIES/i.test(line))mode='cdebt';
  if(/total|current fair market value|check the line|nonmarital|description of|^[A-D]\.\s|net worth|subtotal|column|^\s*\$?\s*$/i.test(line)&&!/\d{1,3},\d{3}/.test(line.replace(/total.*$/i,'')))return;
  if(/^total|total (assets|liabilities|debts)|net worth/i.test(line))return;
  const amts=(line.match(AMT_RE)||[]).filter(a=>!/^\d{4}$/.test(a.replace(/[^\d]/g,''))||/[$,.]/.test(a));if(!amts.length)return;
  const vals=amts.map(amtVal).filter(v=>Math.abs(v)>=1);if(!vals.length)return;
  let desc=line;amts.forEach(a=>{desc=desc.replace(a,' ');});desc=desc.replace(/\[field[^\]]*\]/g,' ').replace(/[☐☒✓✔]|\[\s?x?\s?\]/gi,' ').replace(/\s{2,}/g,' ').replace(/^[\s\-–:|.]+|[\s\-–:|.]+$/g,'').trim();
  if(desc.length<3||/^(yes|no|n\/a|none)$/i.test(desc))return;
  const debt=mode==='debt'||mode==='cdebt';const v=Math.abs(vals[0]);
  rows.push({name:desc.slice(0,90),last4:last4Of(line),cat:guessCat(desc,debt),value:v,debt,contingent:mode.startsWith('c'),page,note:vals.length>1?`Line shows a second figure (${fmc(Math.abs(vals[1]))}) — check whether it is the nonmarital column.`:'',nonmaritalClaim:vals.length>1});});

 const inst=pick([/^(.{0,40}(?:Bank|Credit Union|Fidelity|Vanguard|Schwab|Chase|Wells Fargo|Truist|Regions|Citi|Capital One|Discover|American Express|Navy Federal|USAA|Ally|Merrill|Morgan Stanley|Edward Jones|E\*TRADE|Robinhood|Empower|Principal|Nationwide|Mr\. Cooper|Rocket|PennyMac|Freedom Mortgage|Synchrony).{0,30})$/im]);
 const catMap={bank:/savings|money market/i.test(t.slice(0,4000))&&!/checking/i.test(t.slice(0,4000))?'savings':'checking',brokerage:'brokerage',retirement:'retirement',mortgage:'mortgage',loan:/auto|vehicle/i.test(t.slice(0,3000))?'autoloan':/student/i.test(t.slice(0,3000))?'student':'bankloan',card:'card',deed:'home',appraisal:'home',vehicle:'vehicle',business:'business',tax:'otherAsset',other:'otherAsset'};

 if(!g.exclude.includes('dev')){const pres=r.presumed;const target=g.op==='zero'?0:g.op==='ge'?Math.max(num(g.amount),0):g.op==='between'?(band[0]+band[1])/2:num(g.amount);
  const curPay=r.payer===P0;if(curPay||g.op==='ge'){const dev=round2((g.op==='le'?Math.min(target,r.final):target)-pres);const rr=gEval({dev:String(dev)});const s=sOf(rr,P0);
   if(s>=band[0]-0.5&&s<=band[1]+0.5&&Math.abs(dev-r.deviation)>0.5)out.opts.push({id:'dev',label:'Deviation from the guideline',from:r.deviation?`${fm(r.deviation)}/mo`:'None',to:`${dev<0?'−':'+'}${fm(Math.abs(dev))}/mo`,need:`A § 61.30(11)(a) deviation factor (or § 61.30(11)(b) for substantial time-sharing) and written findings — required when the order varies more than 5% from the guideline (§ 61.30(1)(a)). ${Math.abs(dev)>0.05*pres?'This is '+Math.round(Math.abs(dev)/Math.max(1,pres)*100)+'% of the guideline amount.':''}`,fields:{dev:String(dev)},r:rr,ok:true,move:Math.abs(dev)});}}

async function claudeReadGoal(text){const s=await sampleNS();if(!s)return null;
 const g=await s.json(`A Florida family-law attorney typed this goal for a child support calculation. Turn it into JSON.
Goal: """${String(text).slice(0,600)}"""
Reply with only JSON: {"op":"le"|"ge"|"eq"|"between"|"zero","amount":number|null,"amount2":number|null,"exclude":[...],"only":[...]}
- amounts are monthly child support dollars; "zero"/"no child support" → op "zero".
- "exclude" lists levers the attorney said not to change; "only" lists levers the attorney limited the search to. Lever keys: ov (time-sharing/overnights), incP (paying parent's income), incQ (receiving parent's income), alim (alimony), careP (child care), insP (children's health insurance), taxDep (dependency exemptions), dev (deviation).`,{modelTier:'quick'});
 if(!g||!['le','ge','eq','between','zero'].includes(g.op))return null;const keys=GOAL_LEVERS.map(x=>x[0]);
 const only=(Array.isArray(g.only)?g.only:[]).filter(k=>keys.includes(k));let ex=(Array.isArray(g.exclude)?g.exclude:[]).filter(k=>keys.includes(k));if(only.length)ex=[...new Set([...ex,...keys.filter(k=>!only.includes(k))])];
 return {op:g.op,amount:g.amount??'',amount2:g.amount2??'',exclude:ex,only};}
async function claudeCombos(res,signal){const s=await sampleNS();if(!s)return null;const {ctx,g}=res;const {r,P0,Q}=ctx;const P=role(P0),Qr=role(Q);
 const facts={payer:P,payee:Qr,childSupport:round2(r.final),method:modeL(r),children:r.kids,overnights:{[P]:round2(P0==='A'?r.ovA:r.ovB),[Qr]:round2(P0==='A'?r.ovB:r.ovA)},grossIncome:{[P]:round2(r[P0].gross),[Qr]:round2(r[Q].gross)},netIncome:{[P]:round2(r[P0].net),[Qr]:round2(r[Q].net)},childCarePaid:{[P]:num(S.costs['care'+P0]),[Qr]:num(S.costs['care'+Q])},alimony:r.alAmt?{amount:r.alAmt,paidBy:role(r.alPayer)}:null,deviation:r.deviation};
 const single=res.opts.map(o=>({lever:o.id,change:o.from+' → '+o.to,result:round2(o.r.final)}));const misses=res.misses.map(o=>({lever:o.id,bestPossible:round2(o.r.final)}));
 const prompt=`You help a Florida family-law attorney explore settlement options in a child support guideline calculation (§ 61.30, Fla. Stat.). You never compute support yourself — the app re-runs every proposal through the guideline engine.

Case (monthly figures, parties by role only): ${JSON.stringify(facts)}
Goal: ${goalLabel(g,ctx).replace(pn(P0),P).replace(pn(Q),Qr)}
Levers the attorney excluded: ${JSON.stringify(g.exclude)}
Single-lever answers already found by the engine: ${JSON.stringify(single)}
Levers that cannot reach the goal alone (best possible): ${JSON.stringify(misses)}

Propose up to 3 realistic COMBINATIONS of moderate changes (two or three levers each) that could reach the goal with smaller moves than any single lever. Prefer changes a court could actually adopt; avoid imputing income or deviating unless the attorney's goal leaves nothing else. Never use an excluded lever.
Keys you may set (omit a key to leave it unchanged): payerNights (number, 0-365), payerIncome (monthly gross wages), payeeIncome (monthly gross wages), alimonyFromPayer (monthly), payerChildCare (monthly), payerChildInsurance (monthly premium for the children), deviation (monthly, negative lowers support), taxDep ("payer"|"payee"|"alternate").
Also write a 2-3 sentence plain-English summary of the options for the attorney (no legal conclusions; note what each kind of change would need to be supported by).
Reply with only JSON: {"summary":string,"combos":[{"name":string,"set":{...},"why":string}]}`;
 const out=await s.json(prompt,{modelTier:'default',signal});if(!out||typeof out!=='object')return null;
 const map={payerNights:'ov',payerIncome:'incP',payeeIncome:'incQ',alimonyFromPayer:'alim',payerChildCare:'careP',payerChildInsurance:'insP',deviation:'dev',taxDep:'taxDep'};
 const defs=Object.fromEntries(leverDefs(ctx).map(L=>[L.id,L]));const band=res.band;
 const combos=(Array.isArray(out.combos)?out.combos:[]).slice(0,3).map(c=>{const set=c&&c.set||{};let fields={},parts=[],needs=[],bad=false;
  Object.entries(set).forEach(([k,v])=>{const id=map[k];if(!id||g.exclude.includes(id)){bad=bad||!!id;return;}
   if(id==='taxDep'){const t=v==='payer'?P0:v==='payee'?Q:v==='alternate'?'alt':null;if(t){fields.taxDep=t;parts.push('Dependency: '+(t==='alt'?'alternate children':'all to '+pn(t)));}return;}
   if(id==='dev'){fields.dev=String(round2(num(v)));parts.push(`Deviation ${num(v)<0?'−':'+'}${fm(Math.abs(num(v)))}`);needs.push('Deviation factor and written findings (§ 61.30(1)(a), (11)).');return;}
   const L=defs[id];if(!L)return;const x=Math.min(L.hi,Math.max(L.lo,num(v)));Object.assign(fields,L.fields(x));parts.push(`${L.label}: ${L.fmt(L.cur)} → ${L.fmt(x)}`);needs.push(L.need(x));});
  if(!parts.length)return null;const rr=gEval(fields);const sv=sOf(rr,P0);
  return {name:String(c.name||'Combination').slice(0,80),why:String(c.why||'').slice(0,400),parts,needs,fields,r:rr,ok:sv>=band[0]&&sv<=band[1],excludedUsed:bad};}).filter(Boolean);
 return {summary:String(out.summary||'').slice(0,900),combos};}

 if(/(without|no|don'?t|do not|not)\b[^.;]{0,25}(changing|touching|lowering|raising|changes? (to|in))[^.;]{0,15}(income|wages|salary)/.test(t))g.ex.inc=true;
 // direction
 const minRe=/(at least|no less than|minimum|more than|above|over |increase|raise|higher|maximi[sz]e|bump up|get more|receive more)/;

const GP_BASE={id:'gp',name:'Goal planner',ovNon:'',wagesA:'',wagesB:'',alimony:'',careA:''};

function gpSigned(r,P0){return !r.payer?0:(r.payer===P0?r.final:-r.final);}
function gpOk(g,r){const s=gpSigned(r,g.P0);return g.dir==='max'?s<=g.T+0.5:s>=g.T-0.5;}
function gpGap(g,r){const s=gpSigned(r,g.P0);return g.dir==='max'?Math.max(0,s-g.T):Math.max(0,g.T-s);}
function gpSolveCont(g,mk,cur,lo,hi,steps,round){let best=null;

function gpCard(o){return Object.assign({id:'c'+(++GP.seq)},o);}

  const scan=list=>{for(const n of list){const r=gpEval({ovNon:String(n)});const gap=gpGap(g,r);if(!best||gap<best.gap-0.5)best={n,r,gap};if(gpOk(g,r))return {n,r};}return null;};
  const u=scan(cand),d=scan(down);hit=u&&d?(Math.abs(u.n-cur)<=Math.abs(d.n-cur)?u:d):(u||d);
  const x=hit||best;if(x&&Math.abs(x.n-cur)>=0.5){const crosses=(cur<73)!==(x.n<73);

 // 6 insurance
 const ins=k=>num(S.parties[k].healthChild)+num(S.parties[k].dentalChild)+num(S.parties[k].visionChild);const hQ=ins(Q),hP=ins(P);if(hQ>0||hP>0){const amt=hQ>0?hQ:hP;const ch=hQ>0?{['insChild'+P]:String(hP+hQ),['insChild'+Q]:'0'}:{['insChild'+Q]:String(hP+hQ),['insChild'+P]:'0'};const who=hQ>0?P:Q;
  const r=gpEval(ch);if(Math.abs(r.final-r0.final)>1)cards.push(gpCard({kind:'Health insurance',reached:gpOk(g,r),changes:ch,r,title:`Children’s health insurance moves to ${pn(who)}’s plan`,sub:`${fm(amt)}/mo child premium`,law:'The premium is shared by income percentage; the parent who carries it gets credit. Confirm the plan is reasonable in cost and accessible to the children — § 61.13(1)(b).',rank:3}));}
 // 7 tax
 {let best=null;[['A',null],['B',null],['A','hoh'],['B','hoh']].forEach(([dep,fil])=>{const ch={taxDep:dep};if(fil){const majK=f.maj;ch['filing'+majK]=fil;if(S.parties[majK].filing===fil)return;}const r=gpEval(ch);const sc=gpSigned(r,g.P0);const better=g.dir==='max'?sc<gpSigned(best?best.r:r0,g.P0)-1:sc>gpSigned(best?best.r:r0,g.P0)+1;if(better)best={ch,r,dep,fil};});

 // ---------- client responses & OP requests ----------

 // ---------- retro: charts & summaries by period ----------
 function periods(){S.retro=S.retro||{};S.retro.periods=S.retro.periods||[];return S.retro.periods;}
 function perAmt(p){if(p.sc&&p.sc!=='manual'){const sc=(S.scenarios||[]).find(x=>x.id===p.sc);if(sc)try{return calcFor(sc).final;}catch(e){}}if(p.sc==='current')return R.final;return num(p.cs);}
 function months(a,b){if(!a||!b)return 0;const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');return Math.max(0,(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth())+1);}
 function perModel(){const P=periods().map(p=>{const m=months(p.start,p.end);const cs=perAmt(p);const al=num(p.al);return {...p,m,cs,al,due:(cs+al)*m};});const total=P.reduce((s,p)=>s+p.due,0);const paid=num(S.retro.paidAll);return {P,total,paid,owed:Math.max(0,total-paid)};}
 function perChart(P){if(!P.length)return '';const W=640,H=40+P.length*34,left=170,max=Math.max(1,...P.map(p=>p.due));

 function secRetroCS(){if(EDN_RANK[edition()]<EDN_RANK.ultra)return lockHTML('ultra');const M=perModel();

  return `<h1 class="sec">Charts & summaries</h1><p class="lede">Build retro one period at a time — 2023 at one income, 2024 at another — from saved scenarios. Fix a year and every total updates; nothing gets retyped.</p>
  <style>table.rp{min-width:1000px}table.rp input[type=date]{min-width:150px;max-width:none}table.rp input.m{min-width:100px;max-width:none}table.rp td.nm input{min-width:110px}</style><div class="panel"><div class="tablewrap"><table class="cmp rp"><thead><tr><th>Label</th><th>From</th><th>Through</th><th>Child support from</th><th>CS / mo</th><th>Alimony / mo</th><th>Months</th><th>Accrued</th><th></th></tr></thead><tbody>
  ${M.P.map((p,i)=>`<tr><td class="nm"><input type="text" data-rp="${i}:label" value="${esc(p.label||'')}" placeholder="e.g. 2024"></td><td><input type="date" data-rp="${i}:start" value="${esc(p.start||'')}"></td><td><input type="date" data-rp="${i}:end" value="${esc(p.end||'')}"></td><td><select data-rp="${i}:sc">${opts.replace(`value="${esc(p.sc||'manual')}"`,`value="${esc(p.sc||'manual')}" selected`)}</select></td><td>${(p.sc||'manual')==='manual'?`<input type="text" class="m" data-rp="${i}:cs" value="${esc(p.cs||'')}">`:fm(p.cs)}</td><td><input type="text" class="m" data-rp="${i}:al" value="${esc(p.al||'')}"></td><td>${p.m}</td><td>${fmc(p.due)}</td><td><button class="x" type="button" data-act="rpdel" data-i="${i}" aria-label="Remove period">×</button></td></tr>`).join('')}

 // ---------- wire up ----------
 Object.assign(RENDER,{cdtrk:()=>{const g=uGate();return g||`<h1 class="sec">Client disco — tracker</h1><p class="lede">Everything our client owes and has served, in one place.</p>`+trkCard(ours());},

  ['ins',/insurance|declarations page|policy|dental card|health card|life ins/],['pre',/prenup|premarital|postnup|marital agreement|non-?paternity|disestablish/],['modag',/agreement since|modification agreement/],['uneq',/nonmarital|non-marital|tracing|inheritance|gift letter|premarital funds/],['orders',/support order|order .*support|final judgment|income deduction|\bido\b/]];
 const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
 function dates(s){const out=[];let m;const re1=/(20\d\d)[-_.](\d{1,2})(?:[-_.](\d{1,2}))?/g;while((m=re1.exec(s)))out.push([+m[1],+m[2]]);
  const re2=/\b(\d{1,2})[-_.](\d{1,2})[-_.](20\d\d|\d\d)\b/g;while((m=re2.exec(s)))out.push([+(m[3].length===2?'20'+m[3]:m[3]),+m[1]]);
  const re3=/\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.? ?(20\d\d)\b/gi;while((m=re3.exec(s)))out.push([+m[2],MON[m[1].toLowerCase()]]);
  return out.filter(([y,mo])=>y>2000&&mo>=1&&mo<=12);}
 function years(s){return [...new Set((s.match(/\b20\d\d\b/g)||[]).map(Number))];}
 function partyOf(path){const p=path.toLowerCase();const nm=k=>{const n=(S.parties[k].name||'').toLowerCase().split(/\s+/).filter(x=>x.length>2);return n;};
  const o=ours(),q=opp();const has=k=>nm(k).some(w=>p.includes(w))&&!(nm(k==='A'?'B':'A').filter(w=>!nm(k).includes(w)).some(w=>p.includes(w)));
  if(/our client|\bclient\b|^client|\/client/.test(p))return o;if(/opposing|\bop\b|\bop disco|other party|\boc\b/.test(p))return q;
  if(/joint/.test(p))return 'both';
  const ra=/petitioner|\bpet\b|\bwife\b|\bw's\b/.test(p),rb=/respondent|\bresp\b|\bhusband\b|\bh's\b/.test(p);
  if(has('A')&&!has('B'))return 'A';if(has('B')&&!has('A'))return 'B';if(ra&&!rb)return 'A';if(rb&&!ra)return 'B';return '?';}
 function classify(path){const p=path.toLowerCase().replace(/[_]+/g,' ');const nm=path.split('/').pop();let item='';
  for(const [id,re] of RULES)if(re.test(p)){item=id;break;}
  if(item==='faL'&&/short form|12\.902\(b\)|902b/.test(p))item='faS';
  if(/appraisal|valuation|cma/.test(p)&&!item)item='other';
  const l4=(p.match(/(?:ending|acct|account|x|\*{2,}|…)\s*#?\s*(\d{4})\b/)||[])[1]||'';
  return {path,name:nm,item:item||'?',party:partyOf(path),last4:l4,dates:dates(nm),years:years(nm)};}

 function ym(d){return d[0]*12+d[1]-1;}
 const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const ymS=v=>MN[v%12]+' '+Math.floor(v/12);
 function cover(it,F){const now=new Date();const cur=now.getFullYear()*12+now.getMonth();
  if(it.months){const groups={};F.forEach(f=>{const g=f.last4||f.name.replace(/\d|[-_.()]/g,'').slice(0,18);(groups[g]=groups[g]||new Set());f.dates.forEach(d=>groups[g].add(ym(d)));});
   const res=Object.entries(groups).map(([g,s])=>{const a=[...s].sort((x,y)=>x-y);const need=it.months;const inWin=a.filter(v=>v>cur-need-1);const last=a.length?a[a.length-1]:null;
    return {g,first:a[0],last,have:inWin.length,need,short:inWin.length<need-1,fwd:last!==null&&last<cur-1?last+1:null};});return res;}
  if(it.years){const ys=new Set();F.forEach(f=>f.years.forEach(y=>ys.add(y)));const need=it.years;const y0=now.getFullYear()-1;const have=[...ys].filter(y=>y>=y0-need+1&&y<=y0);
   return [{g:'years',years:[...ys].sort(),have:have.length,need,short:have.length<need&&!(it.id==='tax'&&F.some(f=>/w-?2|1099|k-?1/i.test(f.name))&&have.includes(y0))}];}
  return [];}
 function autoMarker(k,it,F){const iss=issuesOf().map(x=>x[0]);const p=S.parties[k];
  if(it.id==='faS')return 'Not Applicable';
  if(it.id==='faL')return F.length||((S.ed.docs||[]).some(d=>d.role===(k==='A'?'faP':'faR')))?'Produced':'Will Be Produced';
  if(it.id==='incst'){const prod=x=>filesFor(k).some(f=>f.item===x);return prod('pay')||prod('tax')?'Produced':'Will Be Produced';}
  if(F.length)return 'Produced';
  if(it.id==='modag')return iss.includes('mod')?'Will Be Produced':'Not Applicable';
  if(it.id==='orders')return iss.includes('mod')?'Will Be Produced':'Not Applicable';
  if(it.id==='crypto')return (S.ed.items||[]).some(x=>/crypto|virtual|bitcoin/i.test((x.cat||'')+' '+(x.name||'')))?'Will Be Produced':'Not Applicable';
  if(it.id==='corp')return p.selfEmployed||num(p.seIncome)||num(p.k1Income)||(S.ed.items||[]).some(x=>x.cat==='business'&&x.title===(k==='A'?'P':'R'))?'Will Be Produced':'Not Applicable';
  if(it.id==='uneq')return (S.ed.items||[]).some(x=>(x.premarital||has(x.nm))&&(x.title===(k==='A'?'P':'R')||!['P','R'].includes(x.title)))?'Will Be Produced':'Not Applicable';
  if(it.id==='pre')return 'Not Applicable';
  return 'Will Be Produced';}
 function model(k){return COC2.map(it=>{const F=filesFor(k).filter(f=>f.item===it.id);const ov=D().ov[k][it.id];const auto=autoMarker(k,it,F);const mk=ov||auto;const cv=cover(it,F);
